name: Release Builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-builds:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Verify release version
        run: test "v$(cat VERSION)" = "${RELEASE_TAG}"
      - name: Build architecture and universal archives
        run: ./scripts/build_release.sh dist-release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: dist-release/Voice-Memo-Agent-*.zip
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist-release/*.zip dist-release/SHA256SUMS --clobber
